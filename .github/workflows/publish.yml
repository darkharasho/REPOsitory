name: Publish

# Tag a mod release as <mod-dir>-v<version>, e.g. upgrade-limiter-v0.4.4. The version must match
# mods/<mod-dir>/manifest.json. Builds on the self-hosted runner (which has the game install)
# and publishes the zip to Thunderstore, keeping the categories the package already has there.
on:
  push:
    tags: ["*-v*"]

jobs:
  publish:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mod and version from tag
        run: |
          mod="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          manifest="mods/$mod/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME: no $manifest"
            exit 1
          fi
          manifest_version="$(python3 -c "import json; print(json.load(open('$manifest'))['version_number'])")"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $manifest version $manifest_version"
            exit 1
          fi
          name="$(python3 -c "import json; print(json.load(open('$manifest'))['name'])")"
          echo "MOD=$mod" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TITLE=$name $version" >> "$GITHUB_ENV"
          echo "ZIP=builds/$name-$version.zip" >> "$GITHUB_ENV"
          # First upload of a new mod needs categories: mods/<mod>/thunderstore-categories (a,b,c).
          if [ -f "mods/$mod/thunderstore-categories" ]; then
            echo "CATEGORIES=$(tr -d '[:space:]' < "mods/$mod/thunderstore-categories")" >> "$GITHUB_ENV"
          fi

      - name: Build and package
        working-directory: mods/${{ env.MOD }}
        env:
          GAME_DIR: /var/mnt/data/SteamLibrary/steamapps/common/REPO
        run: ./package.sh

      - name: Publish to Thunderstore
        env:
          THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: scripts/thunderstore-publish.sh "$ZIP" --community repo ${CATEGORIES:+--categories "$CATEGORIES"}

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' "mods/$MOD/CHANGELOG.md" > release-notes.md
          printf '\nInstall `%s` with a mod manager (it is a Thunderstore package).\n' "$(basename "$ZIP")" >> release-notes.md

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.TITLE }}
          body_path: release-notes.md
          files: ${{ env.ZIP }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: ${{ env.ZIP }}
