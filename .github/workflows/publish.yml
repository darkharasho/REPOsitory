name: Publish

# Tag a mod release as <mod-dir>-v<version>, e.g. upgrade-limiter-v0.4.4. The version must match
# mods/<mod-dir>/manifest.json. Builds on GitHub's runners against the reference assemblies in
# lib/refs (scripts/update-refs.sh) and publishes the zip to Thunderstore, keeping the categories
# the package already has there. Run it by hand with a tag to publish a tag that already exists.
on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. full-heal-v1.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Tags cut before lib/refs existed build with this workflow commit's reference assemblies.
      - name: Reference assemblies
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- lib/refs Directory.Build.targets

      # Mods target netstandard2.1; the test projects target net6.0 and net10.0; tcli needs 8.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Resolve mod and version from tag
        run: |
          mod="${TAG%-v*}"
          version="${TAG##*-v}"
          manifest="mods/$mod/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::Tag $TAG: no $manifest"
            exit 1
          fi
          manifest_version="$(python3 -c "import json; print(json.load(open('$manifest'))['version_number'])")"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Tag $TAG does not match $manifest version $manifest_version"
            exit 1
          fi
          name="$(python3 -c "import json; print(json.load(open('$manifest'))['name'])")"
          echo "MOD=$mod" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TITLE=$name $version" >> "$GITHUB_ENV"
          # Not ZIP: zip reads $ZIP as extra command-line options.
          echo "PKG_ZIP=builds/$name-$version.zip" >> "$GITHUB_ENV"
          # First upload of a new mod needs categories: mods/<mod>/thunderstore-categories (a,b,c).
          if [ -f "mods/$mod/thunderstore-categories" ]; then
            echo "CATEGORIES=$(tr -d '[:space:]' < "mods/$mod/thunderstore-categories")" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: |
          shopt -s nullglob
          for t in "mods/$MOD"/tests/*/; do dotnet test "$t"; done

      - name: Build and package
        working-directory: mods/${{ env.MOD }}
        env:
          # package.sh needs a game path; with no game there, the build falls back to lib/refs.
          GAME_DIR: /no-game-install
        run: ./package.sh

      - name: Publish to Thunderstore
        env:
          THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: scripts/thunderstore-publish.sh "$PKG_ZIP" --community repo ${CATEGORIES:+--categories "$CATEGORIES"}

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' "mods/$MOD/CHANGELOG.md" > release-notes.md
          printf '\nInstall `%s` with a mod manager (it is a Thunderstore package).\n' "$(basename "$PKG_ZIP")" >> release-notes.md

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          body_path: release-notes.md
          files: ${{ env.PKG_ZIP }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: ${{ env.PKG_ZIP }}
