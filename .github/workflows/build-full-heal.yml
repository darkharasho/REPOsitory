name: Build FullHeal

on:
  push:
    branches: ["main"]
    paths:
      - "mods/full-heal/**"
      - ".github/workflows/build-full-heal.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mods/full-heal/**"
      - ".github/workflows/build-full-heal.yml"

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: mods/full-heal
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          dotnet build FullHeal.csproj \
            --configuration Release \
            /p:GameDir="/var/mnt/data/SteamLibrary/steamapps/common/REPO/"
